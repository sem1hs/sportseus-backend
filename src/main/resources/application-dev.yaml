spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    default-schema: public
    schemas: public, auth

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG